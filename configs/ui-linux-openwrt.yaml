# UI contains no controller credentials or platform-specific commands.
schema_version: 1
instance:
  name: Kee Route Manager UI
  role: ui
paths:
  state_dir: /var/lib/kee-route-manager-ui
  cache_dir: /var/cache/kee-route-manager-ui
  log_file: /var/lib/kee-route-manager-ui/ui.log
  run_dir: /run/kee-route-manager-ui
api:
  enabled: false
web:
  enabled: true
  listen: "127.0.0.1:9444"
  # Bind an explicit private LAN IP here if remote LAN access is desired.
  tls:
    enabled: false
    auto_generate: false
    cert_file: ""
    key_file: ""
ui:
  enabled: true
  upstream: "http://127.0.0.1:9443"
  insecure_tls: false
  request_timeout: 30s
