# Kee Route Manager 1.1.0-rc.1 — Keenetic/Entware/XKeen
# Replace every *.example.invalid URL before installation.
schema_version: 1
instance:
  name: Kee Route Manager
  role: controller
paths:
  state_dir: /opt/var/lib/kee-route-manager
  cache_dir: /opt/var/cache/kee-route-manager
  log_file: /opt/var/log/kee-route-manager.log
  run_dir: /opt/var/run/kee-route-manager
api:
  enabled: true
  listen: "127.0.0.1:9443"
  unix_socket: "/opt/var/run/kee-route-manager/control.sock"
  tls:
    enabled: true
    auto_generate: true
    cert_file: /opt/etc/kee-route-manager/api.crt
    key_file: /opt/etc/kee-route-manager/api.key
    hosts: [127.0.0.1, localhost]
web:
  enabled: false
  listen: "0.0.0.0:9444"
  credentials_file: /opt/etc/kee-route-manager/credentials.json
  session_ttl: 24h
  tls:
    enabled: true
    auto_generate: true
    cert_file: /opt/etc/kee-route-manager/tls.crt
    key_file: /opt/etc/kee-route-manager/tls.key
    hosts: []
platform:
  kind: keenetic
  command_timeout: 30s
  xray_status_command: [/opt/etc/kee-route-manager/xray-status.sh]
  keenetic:
    rci_base_url: "http://127.0.0.1:79/rci/"
    ndmc_binary: ndmc
    xkeen_binary: /opt/sbin/xkeen
    xkeen_policy_name: XKeen
    allow_reboot: true
    allow_policy_change: true
xray:
  binary: /opt/sbin/xray
  asset_dir: /opt/share/xray
  config_dir: /opt/etc/xray/configs
  managed_dir: /opt/etc/xray/configs
  base_routing_file: /opt/etc/xray/configs/05_routing.json
  api_address: "127.0.0.1:10085"
  api_tag: krm-api
  balancer_tag: krm-main
  slot_tag_prefix: krm-slot-
  managed_direct_tag: krm-direct
  probe_port_start: 19000
  health_proxy_port: 18999
  dynamic_api: true
  route:
    inbound_tags: [redirect, tproxy]
    replace_outbound_tags: [REPLACE_WITH_SELECTED_OUTBOUND]
subscriptions:
  max_sources: 20
  max_nodes: 500
  cache_ttl: 168h
  refresh_interval: 30m
  request_timeout: 20s
  max_response_bytes: 4MiB
  sources:
    - id: primary
      name: Primary subscription
      url: "https://subscription.example.invalid/replace-me"
      enabled: true
      headers: {}
targets:
  - id: score_primary
    name: Score target
    url: "https://score-target.example.invalid/replace-me"
    role: score
    weight: 1
    policy: 2xx3xx
    max_response_bytes: 64KiB
  - id: health_primary
    name: Health target
    url: "https://health-target.example.invalid/replace-me"
    role: health
    weight: 1
    policy: 2xx3xx
    max_response_bytes: 64KiB
  - id: health_secondary
    name: Independent health target
    url: "https://independent-health.example.invalid/replace-me"
    role: health
    weight: 1
    policy: 2xx3xx
    max_response_bytes: 64KiB
failover:
  detection_interval: 5s
  failure_threshold: 2
  probe_timeout: 2s
  overall_deadline: 5s
  quorum: 2
health:
  interval: 15s
  failure_threshold: 2
  recovery_threshold: 2
  request_timeout: 8s
  max_response_bytes: 64KiB
  hot_pool_freshness: 5m
  provider_retry_backoff: [15s, 30s, 1m, 2m, 5m, 10m]
pool:
  size: 5
  provider_diversity:
    enabled: false
    max_per_provider: 1
benchmark:
  full_interval: 6h
  batch_size: 20
  latency_workers: 8
  requests_per_weight: 2
  finalists: 6
  min_improvement_percent: 15
  switch_cooldown: 10m
  stability_before_upgrade: 10m
  temporary_proxy_port_start: 20000
  temporary_startup_timeout: 10s
  speed:
    enabled: false
    workers: 2
    url_template: "https://speed-target.example.invalid/download?bytes={bytes}"
    warmup_bytes: 8MiB
    min_sample_bytes: 64MiB
    max_sample_bytes: 512MiB
    target_duration: 6s
    repetitions: 3
update:
  enabled: true
  channel: rc
  github_repository: jarymor-ux/kee-route-manager
  manifest_url: "https://github.com/jarymor-ux/kee-route-manager/releases/download/v1.1.0-rc.1/manifest-rc.json"
  signature_url: "https://github.com/jarymor-ux/kee-route-manager/releases/download/v1.1.0-rc.1/manifest-rc.json.sig"
  public_key: "t8ZyoMK5zMz2vTBuWaH8HIwMOo+E1nJXydOak0RWKAE"
  check_interval: 30m
  auto_apply: false
  health_grace_period: 30s
  allow_downgrade: false
ui:
  enabled: false
  upstream: "https://127.0.0.1:9443"
  insecure_tls: false
  request_timeout: 30s
