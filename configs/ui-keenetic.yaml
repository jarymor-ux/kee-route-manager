# UI contains no controller credentials or platform-specific commands.
schema_version: 1
instance:
  name: Kee Route Manager UI
  role: ui
paths:
  state_dir: /opt/var/lib/kee-route-manager-ui
  cache_dir: /opt/var/cache/kee-route-manager-ui
  log_file: /opt/var/lib/kee-route-manager-ui/ui.log
  run_dir: /opt/var/run/kee-route-manager-ui
api:
  enabled: false
web:
  enabled: true
  listen: "0.0.0.0:9444"
  tls:
    enabled: true
    auto_generate: true
    cert_file: /opt/var/lib/kee-route-manager-ui/tls.crt
    key_file: /opt/var/lib/kee-route-manager-ui/tls.key
    hosts: [localhost]
ui:
  enabled: true
  upstream: "http://127.0.0.1:9443"
  insecure_tls: false
  request_timeout: 30s
