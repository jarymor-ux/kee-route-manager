name: Export RC2 workspace

on:
  push:
    branches: [rc2-hardening]
    paths:
      - .github/workflows/export-rc2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc2-hardening
          fetch-depth: 0
      - name: Create source archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=kee-route-manager-rc2-worktree.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: kee-route-manager-rc2-worktree
          path: kee-route-manager-rc2-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
