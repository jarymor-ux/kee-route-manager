name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source checks
        run: ./scripts/check.sh
      - name: Cross-compile supported targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/krm-build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/krm-build/amd64 ./cmd/kee-route-manager
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/krm-build/arm64 ./cmd/kee-route-manager
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -o /tmp/krm-build/armv7 ./cmd/kee-route-manager
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -o /tmp/krm-build/mipsle ./cmd/kee-route-manager
