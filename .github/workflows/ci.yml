name: CI
on:
  push:
    branches: [main, release-candidate]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Checks and adversarial signed bootstrap
        run: ./scripts/check.sh
      - name: Linux subprocess runtime integration
        run: ./scripts/test-runtime.sh
      - name: Race tests
        run: go test -race ./...
      - name: Static analysis
        run: |
          # The released Staticcheck importer needs the newer Go export reader.
          # Keep this tool-only dependency upgrade outside the product module.
          tools_dir=$(mktemp -d "$RUNNER_TEMP/krm-analysis.XXXXXX")
          (
            cd "$tools_dir"
            go mod init example.invalid/krm-analysis-tools
            go get honnef.co/go/tools@v0.8.1 golang.org/x/tools@v0.50.0
            go install -mod=mod honnef.co/go/tools/cmd/staticcheck
          )
          staticcheck ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find install -type f \( -name '*.sh' -o -name '*.init' -o -name 'S9*' \) -print0 | xargs -0 shellcheck -S warning
          shellcheck -S warning scripts/*.sh
      - name: Fuzz smoke
        run: ./scripts/fuzz-smoke.sh
      - name: Cross-build all components
        run: ./scripts/cross-build.sh
      - name: Container installer lifecycle and real nftables
        run: |
          docker build -t krm-test -f scripts/test.Dockerfile .
          docker run --rm --network none -v "$PWD:/src:ro" krm-test python3 scripts/test-bootstrap.py
          docker run --rm --network none -v "$PWD:/src:ro" krm-test ./scripts/test-install.sh
          docker run --rm --network none --cap-add NET_ADMIN -e KRM_TEST_REAL_NFT=1 -v "$PWD:/src:ro" krm-test go test -v ./internal/platform -run TestRealNftManagedFirewallLifecycle
      - name: Signed release fixture and all artifact digests
        run: ./scripts/test-release.sh
  publish:
    needs: check
    if: github.repository == 'jarymor-ux/kee-route-manager' && github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Bind the release to the tested merged commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          KRM_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == v* ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release-candidate:refs/remotes/origin/release-candidate'
          version=$(python3 scripts/build-version.py --release --check-branch)
          channel=$(python3 scripts/release_channel.py "$version")
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"
          if [[ "$channel" == rc ]]; then printf 'prerelease=true\n' >> "$GITHUB_OUTPUT"; else printf 'prerelease=false\n' >> "$GITHUB_OUTPUT"; fi
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse "$GITHUB_REF^{commit}")" == "$GITHUB_SHA" ]]
          [[ "$(git ls-remote --exit-code origin "$GITHUB_REF" | awk '{print $1}')" == "$(git rev-parse "$GITHUB_REF")" ]]
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-tags"; then
            echo 'This release already exists; published tags and assets are never replaced.' >&2
            exit 1
          fi
      - name: Build and verify signed release artifacts
        env:
          KRM_RELEASE_SIGNING_KEY: ${{ secrets.KRM_RELEASE_SIGNING_KEY }}
          KRM_SOURCE_COMMIT: ${{ github.sha }}
          KRM_RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          KRM_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$KRM_RELEASE_SIGNING_KEY" ]] || { echo 'Release signing secret is not configured' >&2; exit 1; }
          key_file=$(mktemp "$RUNNER_TEMP/krm-signing.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$KRM_RELEASE_SIGNING_KEY" > "$key_file"
          unset KRM_RELEASE_SIGNING_KEY
          KRM_RELEASE_PRIVATE_KEY="$key_file" ./scripts/build-release.sh
          python3 scripts/verify-release.py release/dist
      - name: Verify uploaded draft and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          KRM_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$(git ls-remote --exit-code origin "$GITHUB_REF" | awk '{print $1}')" == "$(git rev-parse "$GITHUB_REF")" ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release-candidate:refs/remotes/origin/release-candidate'
          python3 scripts/build-version.py --release --check-branch >/dev/null
          [[ "$RELEASE_CHANNEL" == "$(python3 scripts/release_channel.py "${GITHUB_REF_NAME#v}")" ]]
          if [[ "$RELEASE_CHANNEL" == rc ]]; then release_label='experimental prerelease'; else release_label='stable channel release'; fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n\n%s\n\n%s\n' \
            "Kee Route Manager $GITHUB_REF_NAME — $release_label." \
            "Signed daemon, UI, CLI and stable launcher artifacts. Update protocol 1 supports explicit updates through the separately installed launcher; platform limits remain documented in docs/KNOWN_LIMITATIONS.md and docs/RELEASE.md." \
            "Built from tested commit $GITHUB_SHA. Platform support remains experimental: router reboot, power-loss, deliberately broken candidate rollback and complete concurrent-control/browser hardware acceptance remain unverified. See [maintained limitations](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/KNOWN_LIMITATIONS.md). Existing release tags and assets are unchanged." > "$notes_file"
          gh release create "$GITHUB_REF_NAME" release/dist/* --verify-tag --draft --prerelease="$RELEASE_PRERELEASE" --latest=false --notes-file "$notes_file"
          uploaded=$(mktemp -d "$RUNNER_TEMP/krm-uploaded.XXXXXX")
          trap 'rm -rf "$uploaded"' EXIT
          gh release download "$GITHUB_REF_NAME" --dir "$uploaded"
          python3 scripts/verify-release.py "$uploaded"
          [[ "$(git ls-remote --exit-code origin "$GITHUB_REF" | awk '{print $1}')" == "$(git rev-parse "$GITHUB_REF")" ]]
          gh release edit "$GITHUB_REF_NAME" --verify-tag --draft=false --prerelease="$RELEASE_PRERELEASE" --latest=false
